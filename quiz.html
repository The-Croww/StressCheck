<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StressCheck - Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="quiz-header">
            <a class="back-link" href="who.html">Return to Category</a>
            <div class="quiz-title" id="quizTitle">StressCheck Quiz</div>
        </div>

        <div class="quiz-section show" id="quizSection">
            <div class="progress-container">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>

            <div class="quiz-container" id="quizContainer"></div>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-card">
                <h2 class="result-header">Your Stress Summary</h2>
                <div class="chart-container">
                    <canvas id="stressChart" width="220" height="220"></canvas>
                    <div class="chart-center-text">
                        <div class="chart-percentage" id="chartPercentage">0%</div>
                        <div class="chart-label">Stress Level</div>
                    </div>
                </div>
                <div class="stress-message" id="stressMessage"></div>
                <button class="retry-button" id="retryButton">Retake Quiz</button><br>
                <li><a href="index.html" class ="exit-button" id=  "startButton"> <b>Exit</b> </a></li>
            </div>
        </div>
    </div>

    <script src="questions/studentquestions.js"></script>
    <script src="questions/adultquestions.js"></script>
    <script src="questions/rathernot.js"></script>
    <script src="quiz-script.js"></script>
</body>
</html>
